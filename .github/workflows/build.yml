name: Build Myra OS ISO

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install NASM and Genisoimage
      run: sudo apt-get update && sudo apt-get install -y nasm genisoimage

    - name: Build Binaries, Image, and Bootable ISO
      run: |
        nasm -f bin boot.asm -o boot.bin
        nasm -f bin kernel.asm -o kernel.bin
        cat boot.bin kernel.bin > os.img
        # Create a bootable ISO using 1.44MB floppy emulation
        genisoimage -b os.img -o myra-os.iso os.img

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: myra-os-iso
        path: myra-os.iso